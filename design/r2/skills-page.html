<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>R2 技能页（独立页面）设计稿</title>
<!--
  技能页设计稿（PRD 第 17 节 v2.7 草案，D-019；2026-11-24）。
  方向用户 2026-11-24 已认可；本稿补齐页面状态，供 UI 稿第 11 节与 DESIGN 第 13 节审核。
  超出 DESIGN.md §2 现行契约的三处只在技能页试点（DESIGN 第 13 节）：
    1. 卡片、列表、横幅用毛玻璃；2. 页面背景有柔和色场（径向渐变）；3. 入场与悬停动效最长 520ms。
  参数：
    ?state=kb | kb-select | tools | distribute | uninstall | novault | scanning | search-empty
    ?theme=dark   ?w=960&h=720（窄窗口）   ?motion=off   ?glass=off   ?shot=1（隐藏原型导航）
-->
<link rel="stylesheet" href="../../src/styles/tokens.css">
<style>
  html, body { margin: 0; background: var(--raw-canvas); font-family: var(--font-ui); color: var(--raw-text); }
  * { box-sizing: border-box; }
  button { font-family: inherit; }

  /* ---------- 试点令牌（DESIGN 第 13 节；只在技能页使用） ---------- */
  :root {
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring-soft: cubic-bezier(0.34, 1.36, 0.64, 1);
    --dur-enter: 520ms;
    --dur-hover: 320ms;
    --dur-slide: 460ms;
    --stagger: 38ms;
    --glass-card: color-mix(in srgb, var(--raw-card) 50%, transparent);
    --glass-card-hover: color-mix(in srgb, var(--raw-card) 66%, transparent);
    --glass-strong: color-mix(in srgb, var(--raw-card) 78%, transparent);
    --glass-edge: rgb(255 255 255 / .7);
    --glass-blur: 18px;
    --field-a: color-mix(in srgb, var(--raw-accent) 36%, transparent);
    --field-b: color-mix(in srgb, var(--info) 24%, transparent);
    --field-c: color-mix(in srgb, var(--live) 16%, transparent);
  }
  [data-theme='dark'] {
    --glass-card: color-mix(in srgb, var(--raw-raised) 46%, transparent);
    --glass-card-hover: color-mix(in srgb, var(--raw-raised) 62%, transparent);
    --glass-strong: color-mix(in srgb, var(--raw-raised) 80%, transparent);
    --glass-edge: rgb(255 255 255 / .09);
    --field-a: color-mix(in srgb, var(--raw-accent) 22%, transparent);
    --field-b: color-mix(in srgb, var(--info) 20%, transparent);
    --field-c: color-mix(in srgb, var(--live) 10%, transparent);
  }

  /* ---------- 外壳 ---------- */
  .app { position: relative; width: var(--app-w, 1440px); height: var(--app-h, 900px); overflow: hidden; background: var(--raw-canvas);
    display: grid; grid-template-rows: var(--titlebar-h) minmax(0, 1fr); }
  .titlebar { display: flex; align-items: center; gap: 12px; padding-left: 12px; position: relative; z-index: 2; }
  .titlebar .brand { display: flex; align-items: center; gap: 8px; font-size: var(--text-body); font-weight: 600; color: var(--raw-text); white-space: nowrap; }
  .titlebar .brand img { width: 18px; height: 18px; }
  .titlebar .vault-tag { font-family: var(--font-mono); font-size: var(--text-caption); letter-spacing: .32em; color: var(--raw-faint); }
  .titlebar .vault-name { flex: 1; min-width: 0; font-size: var(--text-body-sm); color: var(--raw-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .accent-dot { width: 14px; height: 14px; border-radius: 999px; background: var(--raw-accent); flex: none; box-shadow: 0 0 0 3px var(--raw-raised); }
  .win { display: flex; }
  .win span { width: 46px; height: 40px; display: grid; place-items: center; color: var(--raw-text); }

  /* 「工作台 / 技能」切换胶囊：滑块弹性滑动 */
  .nav-switch { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-pill); background: var(--raw-raised); position: relative; flex: none; }
  .nav-switch button { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border: 0; border-radius: var(--radius-pill);
    background: transparent; color: var(--raw-muted); font-size: var(--text-body-sm); font-weight: 600; cursor: pointer; transition: color var(--dur) var(--ease); }
  .nav-switch button[aria-current='page'] { color: var(--raw-strong); }
  .nav-switch .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: var(--radius-pill); background: var(--raw-card);
    box-shadow: 0 1px 2px rgb(20 22 28 / .08); transition: transform var(--dur-slide) var(--ease-spring-soft), width var(--dur-slide) var(--ease-spring-soft); }
  [data-theme='dark'] .nav-switch .thumb { background: var(--raw-line-strong); box-shadow: none; }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; display: inline-grid; place-items: center;
    background: color-mix(in srgb, var(--warn) 18%, var(--raw-card)); color: color-mix(in srgb, var(--warn) 78%, var(--raw-strong));
    font-size: var(--text-caption); font-weight: 700; line-height: 1; }

  /* ---------- 技能页 ---------- */
  .page { position: relative; margin: 0 8px 8px; border-radius: var(--radius-panel); border: 1px solid var(--raw-line);
    background: var(--raw-panel-editor); overflow: hidden; display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 0; isolation: isolate; }
  .narrow .page { grid-template-columns: 56px minmax(0, 1fr); }

  /* 色场：不滚动，给毛玻璃一个可以模糊的背景 */
  .field { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .field i { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .9; will-change: transform; }
  .field .a { width: 620px; height: 620px; left: 300px; top: -220px; background: radial-gradient(circle, var(--field-a), transparent 68%); animation: drift-a 26s var(--ease) infinite alternate; }
  .field .b { width: 560px; height: 560px; right: -160px; top: 180px; background: radial-gradient(circle, var(--field-b), transparent 68%); animation: drift-b 32s var(--ease) infinite alternate; }
  .field .c { width: 520px; height: 520px; left: 520px; bottom: -280px; background: radial-gradient(circle, var(--field-c), transparent 68%); animation: drift-c 28s var(--ease) infinite alternate; }
  @keyframes drift-a { to { transform: translate3d(80px, 60px, 0) scale(1.08); } }
  @keyframes drift-b { to { transform: translate3d(-90px, -40px, 0) scale(.94); } }
  @keyframes drift-c { to { transform: translate3d(60px, -70px, 0) scale(1.05); } }

  /* 左侧导航 */
  .side { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-right: 1px solid var(--raw-line); background: color-mix(in srgb, var(--raw-panel-sidebar) 82%, transparent); min-height: 0; }
  .side-head { padding: 20px 18px 14px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-caption); letter-spacing: .14em; font-weight: 600; color: var(--raw-faint); }
  .eyebrow::before { content: ''; width: 6px; height: 6px; background: var(--raw-accent); }
  .side-title { margin: 8px 0 0; font-size: var(--text-display); font-weight: 650; letter-spacing: -.01em; color: var(--raw-strong); }
  .side-sub { margin: 4px 0 0; font-size: var(--text-meta); color: var(--raw-muted); }
  .side-nav { padding: 6px 10px; overflow: auto; display: grid; align-content: start; gap: 2px; }
  .side-label { margin: 14px 8px 6px; font-size: var(--text-caption); letter-spacing: .1em; font-weight: 600; color: var(--raw-faint); }
  .side-item { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; border-radius: var(--radius-control); background: transparent;
    color: var(--raw-text); font-size: var(--text-body-sm); text-align: left; cursor: pointer; white-space: nowrap; transition: background-color 220ms var(--ease), color 220ms var(--ease); }
  .side-item:hover { background: color-mix(in srgb, var(--raw-raised) 70%, transparent); }
  .side-item[aria-current='true'] { background: var(--raw-accent-soft); color: var(--raw-accent-text); font-weight: 600; }
  .side-item[aria-disabled='true'] { color: var(--raw-faint); cursor: not-allowed; }
  .side-item[aria-disabled='true']:hover { background: transparent; }
  .side-item .n { margin-left: auto; font-size: var(--text-caption); color: var(--raw-faint); font-variant-numeric: tabular-nums; }
  .side-item[aria-current='true'] .n { color: inherit; opacity: .75; }
  .side-item img, .side-item .tool-ico { width: 16px; height: 16px; }
  .side-item .dot { position: absolute; top: 6px; left: 22px; width: 7px; height: 7px; border-radius: 999px; background: var(--warn); box-shadow: 0 0 0 2px var(--raw-panel-sidebar); }
  .side-foot { padding: 12px 14px 14px; border-top: 1px solid var(--raw-line); display: grid; gap: 8px; }
  .meter { height: 6px; border-radius: 999px; background: var(--raw-raised); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 71%; border-radius: inherit; background: var(--raw-accent); transform-origin: left; animation: grow 900ms var(--ease-out-expo) 260ms both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .side-foot .line { display: flex; justify-content: space-between; gap: 8px; font-size: var(--text-meta); color: var(--raw-muted); }
  .side-foot .line b { color: var(--raw-strong); font-variant-numeric: tabular-nums; }
  /* 窄窗口：导航收成图标栏 */
  .narrow .side-head, .narrow .side-label, .narrow .side-item .label, .narrow .side-item .n, .narrow .side-foot .line { display: none; }
  .narrow .side-nav { padding: 12px 8px; gap: 4px; }
  .narrow .side-item { justify-content: center; padding: 0; height: 36px; }
  .narrow .side-sep { height: 1px; margin: 8px 6px; background: var(--raw-line); }
  .side-sep { display: none; }
  .narrow .side-sep { display: block; }
  .narrow .side-foot { padding: 12px 10px 14px; }

  /* 主区 */
  .main { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 16px 24px 12px; min-width: 0; }
  .toolbar h2 { margin: 0; font-size: var(--text-title); font-weight: 650; color: var(--raw-strong); white-space: nowrap; }
  .toolbar .count { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-meta); color: var(--raw-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .toolbar .spacer { flex: 1; }
  .search { display: flex; align-items: center; gap: 6px; width: 300px; min-width: 160px; height: 32px; padding: 0 10px; border: 1px solid var(--raw-line-strong); border-radius: var(--radius-control);
    background: color-mix(in srgb, var(--raw-card) 80%, transparent); color: var(--raw-faint); font-size: var(--text-body-sm);
    transition: border-color 220ms var(--ease); }
  .search[data-filled] { color: var(--raw-text); border-color: var(--raw-accent); }
  .search kbd { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-caption); color: var(--raw-faint); }
  .narrow .search { width: 220px; }
  .view-toggle .segmented-item { padding-inline: 8px; }
  .content { overflow: auto; padding: 4px 24px 28px; min-height: 0; }

  /* 面包屑（子视图） */
  .crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: var(--text-body-sm); color: var(--raw-muted); }
  .crumbs .back { width: 30px; height: 30px; border-radius: var(--radius-control); border: 1px solid var(--raw-line); background: var(--glass-strong); color: var(--raw-text);
    display: grid; place-items: center; cursor: pointer; transition: transform 320ms var(--ease-spring-soft); }
  .crumbs .back:hover { transform: translateX(-2px); }
  .crumbs .sep { color: var(--raw-faint); }
  .crumbs b { font-weight: 650; color: var(--raw-strong); font-size: var(--text-title); }

  .banner { display: flex; align-items: center; gap: 10px; margin: 2px 0 6px; padding: 10px 14px; border-radius: var(--radius-card);
    border: 1px solid color-mix(in srgb, var(--info) 30%, var(--raw-line)); background: var(--glass-strong);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4); backdrop-filter: blur(var(--glass-blur)) saturate(1.4); font-size: var(--text-body-sm); }
  .banner .ico { color: var(--info); }
  .banner .spacer { flex: 1; }

  .group { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 10px; font-size: var(--text-meta); font-weight: 600; color: var(--raw-muted); }
  .group .n { font-weight: 500; color: var(--raw-faint); }
  .group::after { content: ''; flex: 1; height: 1px; background: var(--raw-line); transform: translateY(-3px); }
  .group .grp-act { order: 2; font-size: var(--text-caption); font-weight: 600; color: var(--raw-accent-text); background: none; border: 0; cursor: pointer; padding: 0; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

  /* ---------- 毛玻璃卡片 ---------- */
  .card { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; min-height: 148px; padding: 14px 14px 12px;
    border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--raw-line) 70%, transparent);
    background: var(--glass-card);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.5); backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
    box-shadow: inset 0 1px 0 var(--glass-edge), 0 1px 2px rgb(20 22 28 / .04);
    transform: translate3d(0, 0, 0);
    transition: transform var(--dur-hover) var(--ease-spring-soft), background-color var(--dur-hover) var(--ease),
      border-color var(--dur-hover) var(--ease), box-shadow var(--dur-hover) var(--ease);
    overflow: hidden; }
  [data-theme='dark'] .card { box-shadow: inset 0 1px 0 var(--glass-edge); }
  .card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--raw-accent) 14%, transparent), transparent 60%);
    transition: opacity var(--dur-hover) var(--ease); }
  .card:hover { transform: translate3d(0, -3px, 0); background: var(--glass-card-hover);
    border-color: color-mix(in srgb, var(--raw-accent) 28%, var(--raw-line)); box-shadow: inset 0 1px 0 var(--glass-edge), 0 14px 30px rgb(20 22 28 / .10); }
  [data-theme='dark'] .card:hover { box-shadow: inset 0 1px 0 var(--glass-edge), 0 14px 30px rgb(0 0 0 / .35); }
  .card:hover::before { opacity: 1; }
  .card:active { transform: translate3d(0, -1px, 0) scale(.985); transition-duration: 90ms; }
  .card[data-tone='warn'] { border-color: color-mix(in srgb, var(--warn) 40%, var(--raw-line)); }
  .card[data-selected] { border-color: var(--raw-accent); background: color-mix(in srgb, var(--raw-accent-soft) 70%, transparent); }

  .card .top { display: flex; align-items: center; gap: 10px; min-width: 0; padding-right: 22px; }
  .glyph { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center; color: var(--raw-accent-text);
    background: color-mix(in srgb, var(--raw-accent-soft) 80%, transparent); border: 1px solid color-mix(in srgb, var(--raw-accent) 18%, transparent);
    transition: transform var(--dur-slide) var(--ease-spring-soft); }
  .card:hover .glyph { transform: rotate(-8deg) scale(1.06); }
  .card .name { min-width: 0; font-size: var(--text-body); font-weight: 650; color: var(--raw-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .cat { font-size: var(--text-caption); color: var(--raw-faint); }
  .card .desc { font-size: var(--text-meta); line-height: 1.55; color: var(--raw-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card .meta .spacer { flex: 1; }
  .card .kebab { position: absolute; top: 10px; right: 8px; width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent; color: var(--raw-muted);
    display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity 220ms var(--ease); }
  .card:hover .kebab, .card:focus-within .kebab { opacity: 1; }
  .card .check { position: absolute; top: 14px; right: 12px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--raw-line-strong); background: var(--raw-card);
    display: grid; place-items: center; color: var(--raw-on-accent); transition: transform 320ms var(--ease-spring-soft), background-color 160ms var(--ease); }
  .card[data-selected] .check { background: var(--raw-accent-btn); border-color: var(--raw-accent-btn); transform: scale(1.06); }
  .stack { display: flex; }
  .stack > * { width: 20px; height: 20px; border-radius: 6px; margin-left: -6px; border: 2px solid var(--raw-card); background: var(--raw-card);
    transition: margin var(--dur-hover) var(--ease-spring-soft); }
  .stack > :first-child { margin-left: 0; }
  .card:hover .stack > * { margin-left: -2px; }
  .card:hover .stack > :first-child { margin-left: 0; }
  .none { font-size: var(--text-meta); color: var(--raw-faint); }
  .act { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border: 1px solid var(--raw-line); border-radius: 8px;
    background: color-mix(in srgb, var(--raw-card) 80%, transparent); color: var(--raw-text); font-size: var(--text-meta); font-weight: 600; cursor: pointer;
    opacity: 0; transform: translate3d(6px, 0, 0); transition: opacity 260ms var(--ease), transform 420ms var(--ease-spring-soft), background-color 200ms var(--ease); }
  .card:hover .act, .card:focus-within .act { opacity: 1; transform: none; }
  .act:hover { background: var(--raw-raised); }
  .act .ico { transition: transform 420ms var(--ease-spring-soft); }
  .act:hover .ico { transform: translateX(2px); }

  .card.add { place-content: center; justify-items: center; gap: 8px; text-align: center; border-style: dashed; border-color: var(--raw-line-strong);
    background: color-mix(in srgb, var(--raw-card) 30%, transparent); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; color: var(--raw-muted); cursor: pointer; }
  .card.add .glyph { background: var(--raw-raised); border-color: transparent; color: var(--raw-muted); }
  .card.add:hover { color: var(--raw-accent-text); border-color: var(--raw-accent); }
  .card.add:hover .glyph { transform: rotate(90deg) scale(1.04); color: var(--raw-accent-text); }
  .card.add b { font-size: var(--text-body-sm); }
  .card.add span { font-size: var(--text-caption); color: var(--raw-faint); }

  /* 骨架卡（扫描中）：只动 background-position */
  .card.skel { min-height: 148px; }
  .skel .bar { height: 10px; border-radius: 6px;
    background: linear-gradient(90deg, var(--raw-raised) 0%, color-mix(in srgb, var(--raw-raised) 40%, var(--raw-card)) 50%, var(--raw-raised) 100%);
    background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .spin { width: 10px; height: 10px; border-radius: 999px; border: 1.5px solid currentColor; border-right-color: transparent; animation: turn .9s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }

  /* ---------- 入场：逐张错开、快起慢收 ---------- */
  .reveal { opacity: 0; transform: translate3d(0, 14px, 0) scale(.98); filter: blur(6px);
    animation: rise var(--dur-enter) var(--ease-out-expo) forwards; animation-delay: calc(var(--i, 0) * var(--stagger) + 120ms); }
  @keyframes rise { to { opacity: 1; transform: none; filter: blur(0); } }

  /* ---------- 工具列表 ---------- */
  .list { border-radius: var(--radius-card); border: 1px solid color-mix(in srgb, var(--raw-line) 70%, transparent); background: var(--glass-card);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.5); backdrop-filter: blur(var(--glass-blur)) saturate(1.5); box-shadow: inset 0 1px 0 var(--glass-edge); overflow: hidden; }
  .row { display: grid; grid-template-columns: 22px minmax(140px, 220px) minmax(0, 1fr) 150px 96px; align-items: center; gap: 12px; height: 46px; padding: 0 14px;
    font-size: var(--text-body-sm); transition: background-color 220ms var(--ease); }
  .row + .row { border-top: 1px solid color-mix(in srgb, var(--raw-line) 70%, transparent); }
  .row:hover, .row[data-hover] { background: color-mix(in srgb, var(--raw-accent-soft) 45%, transparent); }
  .row .nm { font-weight: 600; color: var(--raw-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .path { font-family: var(--font-mono); font-size: var(--text-caption); color: var(--raw-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .acts { display: flex; justify-content: flex-end; gap: 4px; opacity: 0; transform: translateX(6px); transition: opacity 240ms var(--ease), transform 380ms var(--ease-spring-soft); }
  .row:hover .acts, .row[data-hover] .acts { opacity: 1; transform: none; }
  .row .acts button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--raw-muted); display: grid; place-items: center; cursor: pointer; }
  .row .acts button:hover { background: var(--raw-raised); color: var(--raw-strong); }
  .row img, .row .tool-ico { width: 18px; height: 18px; }
  .tool-head { display: flex; align-items: center; gap: 8px; margin: 18px 2px 8px; font-size: var(--text-meta); font-weight: 600; color: var(--raw-muted); }
  .tool-head:first-child { margin-top: 4px; }
  .tool-head img, .tool-head .tool-ico { width: 16px; height: 16px; }
  .tool-head .n { color: var(--raw-faint); font-weight: 500; }

  /* ---------- 分发子视图 ---------- */
  .sub-label { display: flex; align-items: baseline; gap: 8px; margin: 18px 2px 10px; font-size: var(--text-meta); font-weight: 600; color: var(--raw-muted); }
  .sub-label:first-child { margin-top: 4px; }
  .sub-label .hint { font-weight: 400; color: var(--raw-faint); }

function distributeContent() {
  const tgt = (k, sub, state, extra = '') => `<button class="target reveal" style="--i:${next()}" role="checkbox" aria-checked="${state === 'on'}"${state === 'off-dis' ? ' aria-disabled="true"' : ''}${extra}>${tico(k)}<span class="t">${k === 'agents' ? '通用目录' : T[k][0]}</span><span class="s">${sub}</span><span class="tick">${state === 'on' ? ico('check', 'ico-sm') : ''}</span></button>`;
  return `<div class="sub-label reveal" style="--i:${next()}">分发方式</div>
    <div class="method reveal" style="--i:${next()}">
      <button role="radio" aria-checked="true"><span class="r"></span><span class="t">目录联接（推荐）</span><span class="s">工具读到的就是知识库里那份，改动立即生效</span></button>
      <button role="radio" aria-checked="false"><span class="r"></span><span class="t">拷贝</span><span class="s">工具里放一份独立副本，记录基线，知识库更新时提示</span></button>
    </div>
    <div class="sub-label reveal" style="--i:${next()}">分发到<span class="hint">已分发的预先勾上；目标已有独立同名技能的不能选</span></div>
    <div class="targets">
      <button class="target reveal" style="--i:${next()}" role="checkbox" aria-checked="false" data-wide>${tico('agents')}<span class="t">通用目录 ~/.agents/skills</span><span class="s">这些工具都会读它</span><span class="readers">${['codex', 'gemini', 'opencode', 'augment', 'workbuddy'].map(k => tico(k)).join('')}</span><span class="tick"></span></button>
      ${tgt('claude', '已分发 · 链接', 'on')}
      ${tgt('cursor', '已分发 · 链接', 'on')}
      ${tgt('kiro', '新增', 'on')}
      ${tgt('qoder', '可分发', 'off')}
      ${tgt('codebuddy', '目标已存在（独立）', 'off-dis')}
      ${tgt('trae', '可分发', 'off')}
      ${tgt('windsurf', '可分发', 'off')}
    </div>
    <button class="more-link">显示未检测到的 14 个工具</button>
    <div class="note reveal" style="--i:${next()}">${ico('warn')}<span>Codex 同时读通用目录和自己的目录。两处都分发时它会加载两次同名技能，建议只选一处。</span></div>`;
}

function emptyNoVault() {
  return `<div class="empty"><span class="big reveal" style="--i:${next()}">${ico('vault', 'ico-lg')}</span>
    <h4 class="reveal" style="--i:${next()}">还没有打开知识库</h4>
    <p class="reveal" style="--i:${next()}">知识库技能放在知识库的 skills 目录里。打开一个知识库后，这里会按分类列出它们；左侧的工具目录现在就可以查看和卸载。</p>
    <div class="actions reveal" style="--i:${next()}"><button class="btn-primary">${ico('folder')}打开知识库…</button><button class="btn-quiet">查看工具目录</button></div></div>`;
}

function emptySearch() {
  return `<div class="empty"><span class="big reveal" style="--i:${next()}">${ico('search', 'ico-lg')}</span>
    <h4 class="reveal" style="--i:${next()}">没有匹配的技能</h4>
    <p class="reveal" style="--i:${next()}">在 10 个知识库技能的名称和描述里都没找到「pdf-tools」。工具目录里的技能可以在左侧「全部工具」里搜。</p>
    <div class="actions reveal" style="--i:${next()}"><button class="btn-quiet">清除搜索</button></div></div>`;
}

function uninstallConfirm() {
  return `<div class="scrim"><div class="confirm" role="alertdialog" aria-label="卸载确认">
    <h3>从 Claude Code 卸载 brainstorming</h3>
    <div class="item">${tico('claude')}<b>brainstorming</b><span class="what">这是指向外部目录的链接：只删除链接 <code>~\\.claude\\skills\\brainstorming</code>，链接指向的 <code>~\\.config\\library\\skills\\brainstorming</code> 不动。</span></div>
    <div class="item">${ico('restore')}<b>可以恢复</b><span class="what">操作记录会保留这一条，需要时在「安装 → 最近操作」里恢复。</span></div>
    <div class="row-btns"><button class="btn-quiet">取消</button><button class="btn-danger">${ico('trash')}卸载 1 项</button></div>
  </div></div>`;
}

function side() {
  const kbView = ['kb', 'kb-select', 'distribute', 'scanning', 'search-empty', 'novault'].includes(STATE);
  const noVault = STATE === 'novault';
  const cats = [['全部技能', 'stack', noVault ? '' : 10, kbView && !noVault], ['前端', 'code', 4], ['后端', 'server', 3], ['通用', 'spark', 3]];
  const tools = [['claude', 69, true], ['kiro', 71], ['cursor', 62], ['qoder', 65], ['codebuddy', 65, true]];
  const item = (iconHtml, label, n, cur, extra = '') => `<button class="side-item" aria-current="${!!cur}"${extra} title="${label}">${iconHtml}<span class="label">${label}</span>${n === '' ? '' : `<span class="n">${n}</span>`}</button>`;
  return `<aside class="side">
    <div class="side-head"><div class="eyebrow">SKILLS</div><h1 class="side-title">技能</h1><p class="side-sub">知识库是源，工具目录是去处</p></div>
    <nav class="side-nav" aria-label="技能导航">
      <div class="side-label">知识库</div>
      ${noVault
        ? item(ico('stack'), '全部技能', '', true)
        : cats.map(([n, g, c, cur]) => item(ico(g), n, c, cur)).join('')}
      <div class="side-sep"></div>
      <div class="side-label">工具目录</div>
      ${item(ico('layout'), '全部工具', 712, STATE === 'tools' || STATE === 'uninstall')}
      ${tools.map(([k, c, dot]) => item(tico(k) + (dot ? '<span class="dot" aria-hidden="true"></span>' : ''), T[k][0], c, false)).join('')}
      ${item(ico('sliders'), '管理目录…', '', false, ' style="color:var(--raw-muted)"')}
    </nav>
    <div class="side-foot">${noVault
      ? '<div class="line"><span>打开知识库后显示分发进度</span></div>'
      : '<div class="line"><span>已分发</span><b>17 / 24</b></div><div class="meter"><i></i></div><div class="line"><span>1 个有更新 · 1 个链接失效</span></div>'}</div>
  </aside>`;
}

function mainArea() {
  const searchBox = (placeholder, value) => `<div class="search"${value ? ' data-filled' : ''}>${ico('search')}${value || placeholder}${value ? `<span style="margin-left:auto;display:grid;place-items:center;color:var(--raw-faint)">${ico('x', 'ico-sm')}</span>` : '<kbd>Ctrl K</kbd>'}</div>`;
  const viewToggle = `<div class="segmented view-toggle" aria-label="显示方式"><button class="segmented-item" aria-selected="true" aria-label="网格">${ico('grid', 'ico-sm')}</button><button class="segmented-item" aria-label="列表">${ico('list', 'ico-sm')}</button></div>`;
  switch (STATE) {
    case 'tools':
    case 'uninstall':
      return { tool: `<h2>全部工具</h2><span class="count">712 个 · 25 个工具，检测到 11 个</span><span class="spacer"></span>${searchBox('搜索技能名')}<button class="btn-primary">${ico('plus')}安装</button>`, body: toolsContent() };
    case 'distribute':
      return {
        tool: `<div class="crumbs"><button class="back" aria-label="返回">${ico('back')}</button><span>全部技能</span><span class="sep">/</span><span>vue技能</span><span class="sep">/</span><b>分发到…</b></div><span class="spacer"></span>`,
        body: distributeContent(),
        dock: `<span>新增 <b>1</b> 处，保留已有 <b>2</b> 处</span><span class="spacer"></span><button class="btn-quiet">取消</button><button class="btn-primary">${ico('send')}分发</button>`,
      };
    case 'kb-select':
      return {
        tool: `<h2>全部技能</h2><span class="count">10 个 · 3 个分类</span><span class="spacer"></span>${searchBox('搜索名称或描述')}${viewToggle}`,
        body: kbContent(true),
        dock: `<span>已选 <b>3</b> 个技能</span><span class="spacer"></span><button class="btn-quiet">取消</button><button class="btn-primary">${ico('send')}分发到…</button>`,
      };
    case 'novault':
      return { tool: `<h2>全部技能</h2><span class="spacer"></span><button class="btn-primary">${ico('plus')}安装</button>`, body: emptyNoVault() };
    case 'scanning':
      return { tool: `<h2>全部技能</h2><span class="count"><span class="spin" aria-hidden="true"></span>正在扫描…</span><span class="spacer"></span>${searchBox('搜索名称或描述')}${viewToggle}<button class="btn-primary">${ico('plus')}安装</button>`, body: skeleton() };
    case 'search-empty':
      return { tool: `<h2>全部技能</h2><span class="count">0 / 10 个</span><span class="spacer"></span>${searchBox('', 'pdf-tools')}${viewToggle}<button class="btn-primary">${ico('plus')}安装</button>`, body: emptySearch() };
    default:
      return { tool: `<h2>全部技能</h2><span class="count">10 个 · 3 个分类</span><span class="spacer"></span>${searchBox('搜索名称或描述')}${viewToggle}<button class="btn-primary">${ico('plus')}安装</button>`, body: kbContent(false) };
  }
}

function render() {
  idx = 0;
  const m = mainArea();
  document.getElementById('root').innerHTML = `
  <div class="app${NARROW ? ' narrow' : ''}" style="--app-w:${APP_W}px;--app-h:${APP_H}px">
    <header class="titlebar">
      <div class="brand"><img src="../../resources/icon.png" alt="">${NARROW ? '' : 'Mile Knowledge Base'}${NARROW ? '' : '<span class="vault-tag">VAULT</span>'}</div>
      <div class="vault-name">${STATE === 'novault' ? '未选择知识库' : '我的知识库'}</div>
      <div class="nav-switch" role="navigation" aria-label="页面">
        <span class="thumb" id="thumb"></span>
        <button data-page="work">${ico('layout', 'ico-sm')}工作台</button>
        <button data-page="skills" aria-current="page">${ico('stack', 'ico-sm')}技能<span class="badge" aria-label="2 项需要处理">2</span></button>
      </div>
      <span class="accent-dot" aria-label="主题色：橙"></span>
      <div class="segmented" role="tablist" aria-label="主题"><button class="segmented-item" aria-selected="${root.dataset.theme === 'light'}">浅色</button><button class="segmented-item" aria-selected="${root.dataset.theme === 'dark'}">深色</button><button class="segmented-item">系统</button></div>
      <div class="win"><span>&#8211;</span><span>&#9633;</span><span>&#10005;</span></div>
    </header>
    <div class="page">
      <div class="field" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
      ${side()}
      <main class="main${m.dock ? ' has-dock' : ''}">
        <div class="toolbar">${m.tool}</div>
        <div class="content">${m.body}</div>
        ${m.dock ? `<div class="dock">${m.dock}</div>` : ''}
      </main>
      ${STATE === 'uninstall' ? uninstallConfirm() : ''}
    </div>
  </div>`;
  placeThumb();
  bindPointerGlow();
}

function placeThumb() {
  const thumb = document.getElementById('thumb');
  const cur = document.querySelector('.nav-switch [aria-current="page"]');
  if (!thumb || !cur) return;
  const move = (b) => { thumb.style.width = b.offsetWidth + 'px'; thumb.style.transform = `translateX(${b.offsetLeft - 3}px)`; };
  move(cur);
  document.querySelectorAll('.nav-switch button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.nav-switch button').forEach(x => x.removeAttribute('aria-current'));
    b.setAttribute('aria-current', 'page');
    move(b);
  });
}

function bindPointerGlow() {
  document.querySelectorAll('.card:not(.add):not(.skel)').forEach(el => {
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', `${e.clientX - r.left}px`);
      el.style.setProperty('--my', `${e.clientY - r.top}px`);
    });
  });
}

render();

if (P.get('shot') !== '1') {
  const q = (o) => { const n = new URLSearchParams(P); Object.entries(o).forEach(([k, v]) => v === null ? n.delete(k) : n.set(k, v)); return '?' + n.toString(); };
  const nav = document.createElement('div');
  nav.className = 'proto-nav';
  const labels = { kb: '知识库技能', 'kb-select': '批量选择', tools: '工具技能', distribute: '分发子视图', uninstall: '卸载确认', novault: '无知识库', scanning: '扫描中', 'search-empty': '搜索无结果' };
  nav.innerHTML = STATES.map(s => `<a href="${q({ state: s === 'kb' ? null : s })}" aria-current="${s === STATE}">${labels[s]}</a>`).join('')
    + [['浅色', q({ theme: null })], ['深色', q({ theme: 'dark' })],
      [NARROW ? '宽窗口' : '窄窗口 960', NARROW ? q({ w: null, h: null }) : q({ w: '960', h: '720' })],
      ['毛玻璃 开/关', q({ glass: root.dataset.glass === 'off' ? null : 'off' })],
      ['动效 开/关', q({ motion: root.dataset.motion === 'off' ? null : 'off' })],
      ['重播入场', 'javascript:location.reload()']].map(([t, h]) => `<a href="${h}">${t}</a>`).join('');
  document.body.appendChild(nav);
}
</script>
</body>
</html>
