<!doctype html>
<html lang="zh-CN" data-theme="light" data-glass="on">
<head>
<meta charset="utf-8">
<title>M8 Glass Spike</title>
<style>
  /* Mirrors DESIGN section 13 (pilot tokens) and the prototype card grid. */
  :root {
    --raw-canvas: #eceef1; --raw-card: #ffffff; --raw-raised: #eceef1; --raw-sunken: #f2f3f5;
    --raw-line: #e1e3e7; --raw-line-strong: #c9cdd4; --raw-strong: #15171c; --raw-text: #24272e;
    --raw-muted: #4b505a; --raw-faint: #5c616b; --raw-accent: #e87226; --raw-accent-soft: #fceee5;
    --raw-accent-text: #aa541c; --raw-panel-editor: #ffffff; --raw-panel-sidebar: #f4f5f7;
    --info: #4338ca; --live: #15803d;
    --glass-card: rgb(255 255 255 / .5); --glass-card-hover: rgb(255 255 255 / .66);
    --glass-edge: rgb(255 255 255 / .7); --glass-blur: 18px;
    --field-a: color-mix(in srgb, var(--raw-accent) 36%, transparent);
    --field-b: color-mix(in srgb, var(--info) 24%, transparent);
    --field-c: color-mix(in srgb, var(--live) 16%, transparent);
    --font-ui: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  [data-theme='dark'] {
    --raw-canvas: #0e0f11; --raw-card: #1c1e22; --raw-raised: #26282d; --raw-sunken: #16171a;
    --raw-line: #2b2e34; --raw-line-strong: #3b3f47; --raw-strong: #f3f4f6; --raw-text: #e6e7ea;
    --raw-muted: #a6aab3; --raw-faint: #9a9ea8; --raw-accent: #fa8234; --raw-accent-soft: #4d3426;
    --raw-accent-text: #fa8234; --raw-panel-editor: #18191d; --raw-panel-sidebar: #141518;
    --info: #8b8ff8; --live: #4ade80;
    --glass-card: rgb(38 40 45 / .46); --glass-card-hover: rgb(38 40 45 / .62);
    --glass-edge: rgb(255 255 255 / .09);
    --field-a: color-mix(in srgb, var(--raw-accent) 22%, transparent);
    --field-b: color-mix(in srgb, var(--info) 20%, transparent);
    --field-c: color-mix(in srgb, var(--live) 10%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--raw-canvas); font-family: var(--font-ui); color: var(--raw-text); overflow: hidden; }
  .app { height: 100vh; display: grid; grid-template-rows: 40px minmax(0, 1fr); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 13px; color: var(--raw-muted); }
  .bar b { color: var(--raw-strong); }
  .bar .spacer { flex: 1; }
  .bar button { height: 26px; padding: 0 10px; border: 1px solid var(--raw-line); border-radius: 8px; background: var(--raw-card); color: var(--raw-text); font: inherit; cursor: pointer; }
  .page { position: relative; margin: 0 8px 8px; border-radius: 16px; border: 1px solid var(--raw-line); background: var(--raw-panel-editor); overflow: hidden; display: grid; grid-template-columns: 248px minmax(0, 1fr); isolation: isolate; }
  .field { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .field i { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .9; }
  .field .a { width: 620px; height: 620px; left: 300px; top: -220px; background: radial-gradient(circle, var(--field-a), transparent 68%); }
  .field .b { width: 560px; height: 560px; right: -160px; top: 180px; background: radial-gradient(circle, var(--field-b), transparent 68%); }
  .field .c { width: 520px; height: 520px; left: 520px; bottom: -280px; background: radial-gradient(circle, var(--field-c), transparent 68%); }
  .side { border-right: 1px solid var(--raw-line); background: color-mix(in srgb, var(--raw-panel-sidebar) 82%, transparent); padding: 20px 18px; }
  .side h1 { margin: 8px 0 0; font-size: 24px; color: var(--raw-strong); }
  .side p { margin: 4px 0 0; font-size: 12px; color: var(--raw-muted); }
  .main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 16px 24px 12px; }
  .toolbar h2 { margin: 0; font-size: 18px; color: var(--raw-strong); }
  .toolbar span { font-size: 12px; color: var(--raw-faint); }
  .content { overflow: auto; padding: 4px 24px 28px; min-height: 0; }
  .group { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 10px; font-size: 12px; font-weight: 600; color: var(--raw-muted); }
  .group::after { content: ''; flex: 1; height: 1px; background: var(--raw-line); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; min-height: 148px; padding: 14px; border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--raw-line) 70%, transparent); background: var(--glass-card);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.5); backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
    box-shadow: inset 0 1px 0 var(--glass-edge), 0 1px 2px rgb(20 22 28 / .04); overflow: hidden; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .glyph { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 13px; font-weight: 700;
    color: var(--raw-accent-text); background: color-mix(in srgb, var(--raw-accent-soft) 80%, transparent); }
  .name { font-size: 14px; font-weight: 650; color: var(--raw-strong); }
  .cat { font-size: 11px; color: var(--raw-faint); }
  .desc { font-size: 12px; line-height: 1.55; color: var(--raw-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--raw-faint); }
  .chip { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--info) 12%, transparent); color: var(--info); font-weight: 600; }
  [data-glass='off'] .card { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--raw-card); }
  [data-glass='off'] .field { display: none; }
  @media (prefers-reduced-motion: reduce) { .field i { animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <b>M8 毛玻璃滚动测量</b><span id="tag">200 张卡片</span>
    <span class="spacer"></span>
    <span id="rm">reduced-motion: ?</span>
    <span id="mode">glass: on</span>
    <button id="toggle">切换毛玻璃</button>
  </div>
  <div class="page">
    <div class="field" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
    <aside class="side"><h1>技能</h1><p>知识库是源，工具目录是去处</p></aside>
    <main class="main">
      <div class="toolbar"><h2>全部技能</h2><span id="count"></span></div>
      <div class="content" id="content"></div>
    </main>
  </div>
</div>
<script>
(() => {
  const TOTAL = 200;
  const SIZE_TAG = new URLSearchParams(location.search).get('size') || '';
  window.__spikeSize = SIZE_TAG;
  const content = document.getElementById('content');
  const cats = ['前端', '后端', '通用'];
  let html = '';
  for (let c = 0; c < cats.length; c++) {
    const n = c === 0 ? 70 : c === 1 ? 65 : 65;
    html += `<div class="group">${cats[c]}<span>${n}</span></div><div class="cards">`;
    for (let i = 0; i < n; i++) {
      const idx = c * 100 + i;
      html += `<article class="card">
        <div class="top"><span class="glyph">${cats[c][0]}</span><div><div class="name">skill-${String(idx + 1).padStart(3, '0')}</div><div class="cat">${cats[c]}</div></div></div>
        <div class="desc">Vue 3 选项式组件、生命周期与请求封装约定；含毛玻璃卡片在滚动时的绘制开销测量。</div>
        <div></div>
        <div class="meta"><span class="chip">已分发</span><span>· 2 处</span></div>
      </article>`;
    }
    html += '</div>';
  }
  content.innerHTML = html;
  document.getElementById('count').textContent = `${TOTAL} 个 · 3 个分类`;
  document.getElementById('tag').textContent = `200 张卡片 · ${SIZE_TAG || 'default'} · 静态页 spike`;

  const rm = document.getElementById('rm');
  const mode = document.getElementById('mode');
  const toggle = document.getElementById('toggle');
  const sync = () => {
    rm.textContent = 'reduced-motion: ' + (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduce' : 'no-preference');
    mode.textContent = 'glass: ' + document.documentElement.dataset.glass;
  };
  toggle.onclick = () => {
    document.documentElement.dataset.glass = document.documentElement.dataset.glass === 'on' ? 'off' : 'on';
    sync();
  };
  sync();

  window.__spike = {
    cards: TOTAL,
    start(ms = 6000, direction = 1) {
      const scroller = content;
      const max = Math.max(1, scroller.scrollHeight - scroller.clientHeight);
      const frames = [];
      let last = 0;
      let t0 = 0;
      window.__spike.last = { frames, done: false };
      const tick = (now) => {
        if (!last) { last = now; t0 = now; }
        else { frames.push(now - last); last = now; }
        const p = Math.min(1, (now - t0) / ms);
        scroller.scrollTop = (direction > 0 ? p : 1 - p) * max;
        if (now - t0 < ms) { requestAnimationFrame(tick); return; }
        window.__spike.last = { frames, done: true };
      };
      requestAnimationFrame(tick);
      return 'started';
    },
    result() {
      const f = (window.__spike.last && window.__spike.last.frames) || [];
      const sorted = [...f].sort((a, b) => a - b);
      const q = (p) => sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(p * (sorted.length - 1)))] : 0;
      const slow = f.filter((d) => d > 33).length;
      const nav = performance.getEntriesByType('navigation')[0];
      return {
        frames: f.length,
        p50: Math.round(q(0.5) * 10) / 10,
        p95: Math.round(q(0.95) * 10) / 10,
        max: sorted.length ? Math.round(sorted[sorted.length - 1] * 10) / 10 : 0,
        slowRatio: Math.round((slow / Math.max(1, f.length)) * 1000) / 1000,
        done: !!(window.__spike.last && window.__spike.last.done),
        glass: document.documentElement.dataset.glass,
        reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
        loadMs: nav ? Math.round(nav.loadEventEnd || nav.domContentLoadedEventEnd) : null,
        cardCount: document.querySelectorAll('.card').length,
      };
    },
  };
})();
</script>
</body>
</html>
